name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deterministic tests
        run: npm test

      - name: Company fixture
        run: npm run fixture -- --outdir=/tmp/company-fixture

      - name: Capital-source fixture
        run: npm run fixture:capital-source -- --outdir=/tmp/capital-source-fixture

      - name: Build sample dashboard
        run: npm run ui:build

      - name: Dry run orchestration
        run: npm run flow -- --input=examples/input.sample.csv --dry-run=true --limit=2
